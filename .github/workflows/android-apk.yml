# Builds the OpenMW 477M APK: the native engine and its libraries (source/buildscripts/build.sh,
# arm64 only), then the launcher (Gradle, mainline debug, debug-signed so it installs as is).
# A first build compiles everything (Boost, ICU, FFmpeg, OSG, OpenMW, ...); the cache below
# keeps those for later builds that only change the launcher.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'images/**']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc-multilib g++-multilib cmake ninja-build \
            pkg-config autoconf automake libtool gettext-base unzip zip wget curl python3 nasm yasm \
            >/dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore the native build
        uses: actions/cache@v4
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/toolchain
            source/buildscripts/build
            source/buildscripts/prefix
          key: native-arm64-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'source/buildscripts/patches/**', 'source/buildscripts/include/**', 'source/buildscripts/build.sh') }}
          restore-keys: native-arm64-

      - name: Native engine (arm64)
        working-directory: source/buildscripts
        run: |
          chmod +x build.sh include/*.sh
          ./build.sh --arch arm64 --jobs "$(nproc)"

      # The post-processing shaders (assets/android_omwfx) are generated on the upstream
      # author's Windows machine and never committed; take them from the latest official
      # release APK. verifyOpenMwPayload also pins that machine's exact libopenmw.so hash,
      # which a CI build can never match, so it is skipped (the files it lists are checked here).
      - name: Shaders from the official release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=app/src/main/assets/android_omwfx
          mkdir -p "$D" /tmp/rel
          gh release download -R Andiweli/OpenMW-Android -p '*.apk' -D /tmp/rel
          ls -l /tmp/rel
          for apk in /tmp/rel/*.apk; do unzip -o -j -q "$apk" 'assets/android_omwfx/*' -d "$D" || true; done
          ls -l "$D"
          for f in gateh_bloom051 godrays_android_051_depthfixed_vivid lensflare_android_051_rayocc \
                   rainlens_android_051_v12_dense wetworld_android_051_weather; do
            test -s "$D/$f.omwfx" || { echo "missing $f.omwfx"; exit 1; }
          done
          test -s app/src/main/jniLibs/arm64-v8a/libopenmw.so
          test -s app/src/main/assets/libopenmw/openmw/defaults.bin

      - name: APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleMainlineDebug -x verifyOpenMwPayload

      - uses: actions/upload-artifact@v4
        with:
          name: openmw-477m-arm64
          path: source/app/build/outputs/apk/mainline/debug/*.apk
          if-no-files-found: error
